<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Albums</title>
</head>

<body>
    <section>
        <section>
            <div class="section-header" style="margin-bottom: 32px;">
                <h1 class="page-title">Manage Albums</h1>
                <button class="btn btn-primary" onclick="showCreateAlbum()">
                    <i class="fas fa-plus"></i> New Album
                </button>
            </div>

            <!-- Minimal Album Creation Form -->
            <div id="create-album-form" class="stat-card" style="display:none; margin-bottom: 32px; max-width: 600px;">
                <h3 style="margin-bottom: 20px;">Create New Album</h3>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Album
                        Title *</label>
                    <input type="text" id="album-name" placeholder="Enter title"
                        style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Cover
                        Image</label>
                    <div style="padding: 16px; border: 2px dashed var(--border); border-radius: var(--radius); text-align: center; cursor: pointer;"
                        onclick="document.getElementById('album-cover').click()">
                        <i class="fas fa-image"
                            style="font-size: 20px; color: var(--text-muted); margin-bottom: 8px; display: block;"></i>
                        <span id="album-cover-label" style="font-size: 12px; color: var(--text-muted);">Optional</span>
                        <input type="file" id="album-cover" accept="image/*"
                            onchange="updateFileLabel('album-cover', 'album-cover-label')" hidden>
                    </div>
                </div>

                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="createAlbum()">Create</button>
                    <button class="btn btn-secondary" onclick="hideCreateAlbum()">Cancel</button>
                </div>
            </div>

            <div th:if="${albums != null and !albums.isEmpty()}" class="song-grid">
                <a th:each="album : ${albums}" th:href="@{/album/{id}(id=${album.id})}" class="song-card">
                    <img th:src="${album.coverImage ?: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 1 1%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/%3E%3C/svg%3E'}"
                        alt="album cover">
                    <div style="margin-top: 8px;">
                        <div style="font-weight: 600; font-size: 14px; color: white;" th:text="${album.name}">Album Name
                        </div>
                        <div style="color: var(--text-muted); font-size: 12px;" th:text="${album.releaseDate}">Release
                            Date</div>
                    </div>
                </a>
            </div>

            <div th:if="${albums == null or albums.isEmpty()}" class="empty-state">
                <i class="fas fa-record-vinyl"
                    style="font-size: 40px; color: var(--text-muted); margin-bottom: 16px;"></i>
                <p>No albums yet. Create your first one!</p>
            </div>
        </section>
    </section>
</body>

</html>
