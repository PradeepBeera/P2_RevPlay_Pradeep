<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Favorites</title>
</head>

<body>
    <section>
        <h1 class="page-title"><i class="fas fa-heart gradient-text"></i> Liked Songs</h1>
        <div th:if="${favorites != null and !favorites.isEmpty()}" class="track-list">
            <div th:each="song,iter : ${favorites}" class="track-row" th:data-id="${song.id}"
                th:data-title="${song.title}" th:data-artist="${song.artistName}" th:data-url="${song.audioUrl}"
                th:data-cover="${song.coverImage}"
                onclick="playSong(+this.dataset.id, this.dataset.title, this.dataset.artist, this.dataset.url, this.dataset.cover)">
                <span class="track-num" th:text="${iter.index + 1}">1</span>
                <div class="track-cover-sm">
                    <img th:if="${song.coverImage}" th:src="${song.coverImage}" alt="">
                    <div th:unless="${song.coverImage}" class="cover-placeholder-sm"><i class="fas fa-music"></i></div>
                </div>
                <div class="track-info">
                    <span class="track-title" th:text="${song.title}">Song</span>
                    <span class="track-artist" th:text="${song.artistName}">Artist</span>
                </div>
                <span class="track-plays"><i class="fas fa-play"></i> <span th:text="${song.playCount}">0</span></span>
            </div>
        </div>
        <div th:if="${favorites == null or favorites.isEmpty()}" class="empty-state">
            <i class="fas fa-heart"></i>
            <p>No liked songs yet. Start exploring and click the heart!</p>
        </div>
    </section>
</body>

</html>
