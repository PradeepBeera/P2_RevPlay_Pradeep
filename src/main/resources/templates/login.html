<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RevPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">

<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-text">RevPlay</span>
        </div>

        <!-- Portal Selection -->
        <div id="portal-section">
            <h2 style="margin-bottom: 10px;">Welcome Back</h2>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Choose your portal to continue</p>

            <button class="btn btn-primary btn-full" onclick="selectRole('listener')"
                style="margin-bottom: 12px;">Listener Portal</button>
            <button class="btn btn-outline btn-full" onclick="selectRole('artist')">Artist Portal</button>
        </div>

        <!-- Login Form -->
        <div id="login-section" style="display: none;">
            <h2 id="login-title" style="margin-bottom: 20px;">Sign In</h2>

            <div th:if="${param.error}" class="alert alert-error" style="color: #ef4444; margin-bottom: 15px;">Invalid
                email or password.</div>
            <div th:if="${param.logout}" class="alert alert-success" style="color: #22c55e; margin-bottom: 15px;">Logged
                out.</div>

            <form id="login-form" th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="remember-me" name="remember-me" style="width: auto;">
                    <label for="remember-me" style="margin: 0;">Remember Me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                <button type="button" class="btn btn-outline btn-full" style="margin-top: 10px;"
                    onclick="goBack()">Back</button>
            </form>
        </div>

        <p style="margin-top: 30px; text-align: center; color: var(--text-secondary); font-size: 14px;">
            New here? <a th:href="@{/register}" style="color: var(--accent); font-weight: 600;">Create Account</a>
        </p>
    </div>

    <!-- Password Recovery Modal (Hidden by default) -->
    <div id="reset-modal" class="modal">
        <div class="modal-content auth-card" style="width: 95%; max-width: 450px; position: relative;">
            <span onclick="closeResetModal()"
                style="position: absolute; right: 25px; top: 20px; cursor: pointer; font-size: 1.8rem;">&times;</span>
            <h2 style="margin-bottom: 10px;">Reset Password</h2>
            <div id="reset-error" class="alert alert-error" style="display:none; margin-bottom: 20px;"></div>

            <!-- Step 1: Account Search -->
            <div id="step-1">
                <p class="auth-subtitle">Verify your identity via registered email.</p>
                <div class="form-group">
                    <label>Account Email</label>
                    <input type="email" id="reset-email" placeholder="example@email.com">
                </div>
                <button onclick="handleForgotPasswordStep1()" class="btn btn-primary btn-full">Find Account</button>
            </div>

            <!-- Step 2: Security Validation & New Password -->
            <div id="step-2" style="display:none;">
                <p id="security-question-text" class="auth-subtitle"
                    style="color: var(--primary-color); font-weight: 600; font-size: 1.1rem; margin-bottom: 15px;"></p>
                <div class="form-group">
                    <label>Security Answer</label>
                    <input type="text" id="reset-answer" placeholder="Enter your answer">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="reset-new-password" placeholder="At least 8 characters">
                </div>
                <button onclick="handleForgotPasswordStep2()" class="btn btn-primary btn-full">Reset Now</button>
            </div>

            <!-- Step 3: Success Confirmation -->
            <div id="step-3" style="display:none; text-align: center;">
                <i class="fas fa-check-circle"
                    style="font-size: 3.5rem; color: var(--primary-color); margin-bottom: 20px;"></i>
                <p class="auth-subtitle">Your password has been successfully updated!</p>
                <button onclick="closeResetModal()" class="btn btn-primary btn-full">Return to Login</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Switches the view from Portal selection to Login form
         */
        function selectRole(role) {
            document.getElementById('portal-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';

            const title = document.getElementById('login-title');
            const subtitle = document.getElementById('login-subtitle');
            const regLink = document.getElementById('register-link');

            if (role === 'artist') {
                title.textContent = 'Artist Dashboard';
                subtitle.textContent = 'Sign in to access creator analytics and uploads';
                // Update registration link to carry over the Artist role
                regLink.href = '/register?role=ARTIST';
            } else {
                title.textContent = 'Listener Portal';
                subtitle.textContent = 'Sign in to access your music library';
                // Update registration link to carry over the Listener role
                regLink.href = '/register?role=LISTENER';
            }
        }

        /**
         * Switches back to Portal selection
         */
        function goBack() {
            document.getElementById('portal-section').style.display = 'block';
            document.getElementById('login-section').style.display = 'none';
        }

        /**
         * Opens the Forgot Password modal
         */
        function openResetModal() {
            const modal = document.getElementById('reset-modal');
            modal.style.display = 'flex'; // Use flex for centering
            document.getElementById('step-1').style.display = 'block';
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'none';
            document.getElementById('reset-error').style.display = 'none';
        }

        /**
         * Closes the Forgot Password modal
         */
        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
        }

        /**
         * Step 1: Searches for user and retrieves security question
         */
        async function handleForgotPasswordStep1() {
            const email = document.getElementById('reset-email').value;
            if (!email) {
                showResetError('Email is required');
                return;
            }

            try {
                const response = await fetch(`/api/auth/security-question?email=${encodeURIComponent(email)}`);
                const data = await response.json();

                if (data.success) {
                    // Show the security question to the user
                    document.getElementById('security-question-text').textContent = data.data;
                    document.getElementById('step-1').style.display = 'none';
                    document.getElementById('step-2').style.display = 'block';
                    document.getElementById('reset-error').style.display = 'none';
                } else {
                    showResetError(data.message || 'We could not find that account');
                }
            } catch (err) {
                showResetError('Server error. Please try again later.');
            }
        }

        /**
         * Step 2: Validates security answer and resets password
         */
        async function handleForgotPasswordStep2() {
            const email = document.getElementById('reset-email').value;
            const answer = document.getElementById('reset-answer').value;
            const newPassword = document.getElementById('reset-new-password').value;

            if (!answer || !newPassword) {
                showResetError('All fields are required');
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        securityAnswer: answer,
                        newPassword: newPassword
                    })
                });
                const data = await response.json();

                if (data.success) {
                    // Transition to success screen
                    document.getElementById('step-2').style.display = 'none';
                    document.getElementById('step-3').style.display = 'block';
                    document.getElementById('reset-error').style.display = 'none';
                } else {
                    showResetError(data.message || 'Incorrect answer or invalid password');
                }
            } catch (err) {
                showResetError('Server error. Please try again.');
            }
        }

        /**
         * Displays error messages inside the modal
         */
        function showResetError(msg) {
            const errorDiv = document.getElementById('reset-error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        /**
         * Persistence: If server returns error, keep user on login section
         */
        if (window.location.search.includes('error')) {
            document.getElementById('portal-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }
    </script>
</body>

</html>
