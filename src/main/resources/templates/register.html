<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RevPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">

<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <!-- App Branding -->
            <div class="auth-brand">
                <h1>RevPlay</h1>
                <p>Premium Music Experience</p>
            </div>

            <h2>Create Account</h2>
            <p id="reg-subtitle" class="auth-subtitle">Join us to start your music journey</p>

            <div id="role-badge"
                style="display:inline-block; margin-bottom: 24px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                Account Type
            </div>

            <!-- Dynamic Error Feedback -->
            <div id="auth-error" class="alert alert-error"
                style="display:none; background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: var(--radius); margin-bottom: 20px;">
            </div>

            <!-- Registration Form -->
            <form id="register-form" onsubmit="handleRegister(event)">
                <input type="hidden" id="role" name="role" value="LISTENER">

                <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                    <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Email
                        Address</label>
                    <input type="email" id="email" name="email" class="form-input" required
                        placeholder="name@example.com"
                        style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                </div>

                <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                    <label
                        style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Display
                        Name (Optional)</label>
                    <input type="text" id="displayName" name="displayName" class="form-input"
                        placeholder="Your public name"
                        style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                </div>

                <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                    <label
                        style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required
                        placeholder="Choose a username" minlength="3"
                        style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                </div>

                <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                    <label
                        style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required
                        placeholder="Min 8 characters" minlength="8"
                        style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                </div>

                <!-- Security Question Section -->
                <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
                    <p style="font-size: 14px; font-weight: 600; margin-bottom: 16px;">Account Recovery</p>

                    <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                        <label
                            style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Security
                            Question</label>
                        <select id="securityQuestion" name="securityQuestion" required
                            style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                            <option value="">Select a question...</option>
                            <option value="What was the name of your first pet?">What was the name of your first pet?
                            </option>
                            <option value="In what city were you born?">In what city were you born?</option>
                            <option value="What is your mother's maiden name?">What is your mother's maiden name?
                            </option>
                            <option value="What was the make and model of your first car?">What was the make and model
                                of your first car?</option>
                            <option value="What was the name of your elementary school?">What was the name of your
                                elementary school?</option>
                        </select>
                    </div>

                    <div class="form-group" style="text-align: left; margin-bottom: 24px;">
                        <label
                            style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block;">Your
                            Answer</label>
                        <input type="text" id="securityAnswer" name="securityAnswer" required
                            placeholder="Answer for recovery"
                            style="width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius); color: white;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="register-btn">Create Account</button>
            </form>

            <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);">
                <p style="color: var(--text-muted); font-size: 14px;">Already have an account? <a th:href="@{/login}"
                        style="color: var(--primary); font-weight: 600;">Sign In</a></p>
            </div>
        </div>
    </div>
    <script>
        // When the page loads, check if we have a 'role' in the URL (e.g., ?role=ARTIST)
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'LISTENER';

        // 1. Update the UI Badge
        const roleBadge = document.getElementById('role-badge');
        const regSubtitle = document.getElementById('reg-subtitle');
        // 2. Update the Hidden Input Field (Very important for auth.js)
        const roleInput = document.getElementById('role');

        roleInput.value = role;

        if (role === 'ARTIST') {
            roleBadge.textContent = 'Artist Account';
            roleBadge.style.background = '#1DB954'; // Spotify Green
            regSubtitle.textContent = 'Join as a creator and share your music';
        } else {
            roleBadge.textContent = 'Listener Account';
            roleBadge.style.background = '#007bff'; // Modern Blue
            regSubtitle.textContent = 'Join as a listener and discover music';
        }
    </script>
    <!-- Script handling the registration API call -->
    <script th:src="@{/js/auth.js}"></script>
</body>

</html>
