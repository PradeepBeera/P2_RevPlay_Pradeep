<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RevPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <style>
        /* Modern Registration Page Styling */
        body.auth-body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('/images/auth-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(18, 18, 18, 0.85);
            /* Dark semi-transparent background */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            /* Centered narrow card */
        }
    </style>
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <!-- App Branding -->
            <div class="auth-brand">
                <i class="fas fa-compact-disc brand-icon-lg"></i>
                <h1>RevPlay</h1>
            </div>

            <h2>Create Account</h2>
            <p id="reg-subtitle" class="auth-subtitle">Join our community and start your music journey</p>

            <div id="role-badge"
                style="display:inline-block; margin-bottom: 20px; padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; background: var(--primary-color); color: #fff;">
                Listener Account
            </div>

            <!-- Dynamic Error Feedback -->
            <div id="auth-error" class="alert alert-error" style="display:none;"></div>

            <!-- Registration Form -->
            <form id="register-form" onsubmit="handleRegister(event)">
                <!-- Hidden field to store the role (ARTIST or LISTENER) -->
                <input type="hidden" id="role" name="role" value="LISTENER">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="username">Unique Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username"
                        minlength="3">
                </div>
                <div class="form-group">
                    <label for="displayName">Display Name (Optional)</label>
                    <input type="text" id="displayName" name="displayName" placeholder="Your public name">
                </div>
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" name="password" required placeholder="At least 8 characters"
                        minlength="8">
                </div>

                <!-- Security Section for Account Recovery -->
                <div class="form-group"
                    style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <label for="securityQuestion">Security Question</label>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Used for password
                        recovery</p>
                    <select id="securityQuestion" name="securityQuestion" required class="form-select">
                        <option value="">Select a question...</option>
                        <option value="What was the name of your first pet?">What was the name of your first pet?
                        </option>
                        <option value="In what city were you born?">In what city were you born?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What was the make and model of your first car?">What was the make and model of
                            your first car?</option>
                        <option value="What was the name of your elementary school?">What was the name of your
                            elementary school?</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="securityAnswer">Your Answer</label>
                    <input type="text" id="securityAnswer" name="securityAnswer" required
                        placeholder="Answer for recovery">
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="register-btn">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a th:href="@{/login}">Sign In</a></p>
        </div>
    </div>
    <script>
        // When the page loads, check if we have a 'role' in the URL (e.g., ?role=ARTIST)
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'LISTENER';

        // 1. Update the UI Badge
        const roleBadge = document.getElementById('role-badge');
        const regSubtitle = document.getElementById('reg-subtitle');
        // 2. Update the Hidden Input Field (Very important for auth.js)
        const roleInput = document.getElementById('role');

        roleInput.value = role;

        if (role === 'ARTIST') {
            roleBadge.textContent = 'Artist Account';
            roleBadge.style.background = '#1DB954'; // Spotify Green
            regSubtitle.textContent = 'Join as a creator and share your music';
        } else {
            roleBadge.textContent = 'Listener Account';
            roleBadge.style.background = '#007bff'; // Modern Blue
            regSubtitle.textContent = 'Join as a listener and discover music';
        }
    </script>
    <!-- Script handling the registration API call -->
    <script th:src="@{/js/auth.js}"></script>
</body>

</html>
