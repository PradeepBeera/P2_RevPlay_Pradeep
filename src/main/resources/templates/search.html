<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Search</title>
</head>

<body>
    <section>
        <div class="section-header">
            <h1 class="page-title">Search</h1>
        </div>

        <form th:action="@{/search}" method="get" style="margin-bottom: 40px;">
            <div style="display: flex; gap: 12px;">
                <input type="text" name="query" th:value="${query}" placeholder="Search songs or artists..."
                    style="flex: 1; padding: 14px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: white; font-size: 16px; outline: none;"
                    autofocus>
                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Search</button>
            </div>
        </form>

        <div th:if="${artists != null and !artists.isEmpty()}" class="section" style="margin-top: 40px;">
            <h2 style="margin-bottom: 20px;">Artists</h2>
            <div class="song-grid">
                <a th:each="artist : ${artists}" th:href="@{/artist/{id}(id=${artist.id})}" class="song-card"
                    style="text-align: center;">
                    <img th:src="${artist.bannerImage ?: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 1 1%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/%3E%3C/svg%3E'}"
                        alt="artist" style="border-radius: 50%;">
                    <div style="margin-top: 8px; font-weight: 600; color: white;" th:text="${artist.artistName}">Artist
                    </div>
                </a>
            </div>
        </div>

        <div th:if="${songs != null and !songs.getContent().isEmpty()}" class="section" style="margin-top: 40px;">
            <h2 style="margin-bottom: 20px;">Songs</h2>
            <div class="track-list">
                <div th:each="song,iter : ${songs.content}" class="track-row" th:data-id="${song.id}"
                    th:data-title="${song.title}" th:data-artist="${song.artistName}" th:data-url="${song.audioUrl}"
                    th:data-cover="${song.coverImage}"
                    onclick="playSong(+this.dataset.id, this.dataset.title, this.dataset.artist, this.dataset.url, this.dataset.cover)">
                    <span class="track-num" th:text="${iter.index + 1}">1</span>
                    <div class="track-info">
                        <span class="track-title" th:text="${song.title}">Song</span>
                        <span class="track-artist" th:text="${song.artistName}">Artist</span>
                    </div>
                    <span class="track-plays" th:text="${song.playCount + ' plays'}">0 plays</span>
                </div>
            </div>
        </div>

        <div th:if="${query != null and (songs == null or songs.getContent().isEmpty()) and (artists == null or artists.isEmpty())}"
            class="empty-state">
            <i class="fas fa-search" style="font-size: 40px; color: var(--text-muted); margin-bottom: 16px;"></i>
            <p>No results found for "<span th:text="${query}">query</span>"</p>
        </div>
    </section>
    </section>
</body>

</html>
