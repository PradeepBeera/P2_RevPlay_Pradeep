<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Browse</title>
</head>

<body>
    <section>
        <h1 class="page-title">Browse Music</h1>
        <section>
            <div class="section-header">
                <h1 class="page-title">Browse Music</h1>
                <p style="color: var(--text-muted); margin-bottom: 24px;">Discover songs from our community of artists.
                </p>
            </div>

            <div th:if="${songs != null}" class="song-grid">
                <div th:each="song : ${songs.content}" class="song-card" th:data-id="${song.id}"
                    th:data-title="${song.title}" th:data-artist="${song.artistName}" th:data-url="${song.audioUrl}"
                    th:data-cover="${song.coverImage}"
                    onclick="playSong(+this.dataset.id, this.dataset.title, this.dataset.artist, this.dataset.url, this.dataset.cover)">
                    <img th:src="${song.coverImage ?: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 1 1%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/%3E%3C/svg%3E'}"
                        alt="cover">
                    <div style="margin-top: 10px;">
                        <div style="font-weight: 600; font-size: 14px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                            th:text="${song.title}">Song</div>
                        <div style="color: var(--text-muted); font-size: 12px;" th:text="${song.artistName}">Artist
                        </div>
                        <div style="color: var(--text-muted); font-size: 11px; margin-top: 4px;"><i class="fas fa-play"
                                style="font-size: 10px;"></i> <span th:text="${song.playCount}">0</span></div>
                    </div>
                </div>
            </div>

            <div th:if="${songs != null and songs.totalPages > 1}" class="pagination">
                <a th:if="${songs.number > 0}" th:href="@{/browse(page=${songs.number - 1})}" class="btn btn-primary"
                    style="padding: 8px 16px;">Previous</a>
                <span class="page-info" th:text="'Page ' + (${songs.number} + 1) + ' of ' + ${songs.totalPages}">Page
                    1</span>
                <a th:if="${songs.number < songs.totalPages - 1}" th:href="@{/browse(page=${songs.number + 1})}"
                    class="btn btn-primary" style="padding: 8px 16px;">Next</a>
            </div>

            <div th:if="${songs == null or songs.content.isEmpty()}" class="empty-state">
                <i class="fas fa-music"></i>
                <p>No songs found. Check back later!</p>
            </div>
        </section>
    </section>
</body>

</html>
