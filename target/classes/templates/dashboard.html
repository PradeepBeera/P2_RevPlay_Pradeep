<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Dashboard</title>
</head>

<body>
    <section th:if="${analytics}">
        <div class="section-header">
            <h1 class="page-title">Artist Dashboard</h1>
        </div>

        <!-- Minimal Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-music stat-icon"></i>
                <div class="stat-value" th:text="${analytics.totalSongs}">0</div>
                <div class="stat-label">Total Songs</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-play stat-icon"></i>
                <div class="stat-value" th:text="${analytics.totalPlays}">0</div>
                <div class="stat-label">Total Plays</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-heart stat-icon"></i>
                <div class="stat-value" th:text="${analytics.totalFavorites}">0</div>
                <div class="stat-label">Favorites</div>
            </div>
        </div>

        <div class="section" style="margin-top: 40px;">
            <h2>Listening Trends</h2>
            <div
                style="background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 20px;">
                <canvas id="trendChart" style="max-height: 300px;"></canvas>
            </div>
        </div>

        <div id="trend-data" style="display:none;" th:attr="data-labels=${#strings.listJoin(analytics.dailyTrends.![label], ',')},
                      data-values=${#strings.listJoin(analytics.dailyTrends.![value], ',')}">
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                const dataEl = document.getElementById('trend-data');
                const labels = dataEl.dataset.labels.split(',').filter(l => l);
                const values = dataEl.dataset.values.split(',').filter(v => v).map(Number);

                new Chart(document.getElementById('trendChart'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Plays',
                            data: values,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            });
        </script>

        <div th:if="${analytics.topSongs != null and !analytics.topSongs.isEmpty()}" class="section"
            style="margin-top: 40px;">
            <h2>Your Top Songs</h2>
            <div class="track-list" style="margin-top: 20px;">
                <div th:each="song,iter : ${analytics.topSongs}" class="track-row" th:data-id="${song.id}"
                    th:data-title="${song.title}" th:data-artist="${song.artistName}" th:data-url="${song.audioUrl}"
                    th:data-cover="${song.coverImage}"
                    onclick="playSong(+this.dataset.id, this.dataset.title, this.dataset.artist, this.dataset.url, this.dataset.cover)">
                    <span class="track-num" th:text="${iter.index + 1}">1</span>
                    <div class="track-info">
                        <span class="track-title" th:text="${song.title}">Song</span>
                        <span class="track-artist" th:text="${song.artistName}">Artist</span>
                    </div>
                    <span class="track-plays" th:text="${song.playCount + ' plays'}">0 plays</span>
                    <button class="track-action" title="Delete" th:data-id="${song.id}"
                        onclick="event.stopPropagation(); deleteSong(this.dataset.id)">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>
    </section>
</body>

</html>
