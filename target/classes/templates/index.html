<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>Home</title>
</head>

<body>
    <section>
        <div class="section-header">
            <h1 class="page-title">Welcome back!</h1>
            <p style="color: var(--text-muted);">Explore what's trending or discvover new music.</p>
        </div>

        <div class="section" th:if="${songs != null and !songs.isEmpty()}" style="margin-top: 32px;">
            <div class="section-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Trending Today</h2>
                <a th:href="@{/browse}" style="color: var(--primary); font-size: 14px; font-weight: 600;">Browse all</a>
            </div>

            <div class="song-grid">
                <div th:each="song : ${songs}" class="song-card" th:data-id="${song.id}" th:data-title="${song.title}"
                    th:data-artist="${song.artistName}" th:data-url="${song.audioUrl}"
                    th:data-cover="${song.coverImage}"
                    onclick="playSong(+this.dataset.id, this.dataset.title, this.dataset.artist, this.dataset.url, this.dataset.cover)">
                    <img th:src="${song.coverImage ?: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 1 1%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/%3E%3C/svg%3E'}"
                        alt="song image">
                    <div style="margin-top: 8px;">
                        <div style="font-weight: 600; font-size: 14px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                            th:text="${song.title}">Song Name</div>
                        <div style="color: var(--text-muted); font-size: 12px;" th:text="${song.artistName}">Artist Name
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section" th:if="${artists != null and !artists.isEmpty()}" style="margin-top: 48px;">
            <div class="section-header" style="margin-bottom: 20px;">
                <h2>Top Artists</h2>
            </div>
            <div class="song-grid"> <!-- Use song-grid for a simple clean look -->
                <a th:each="artist : ${artists}" th:href="@{/artist/{id}(id=${artist.id})}" class="song-card"
                    style="text-align: center;">
                    <img th:src="${artist.bannerImage ?: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 1 1%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/%3E%3C/svg%3E'}"
                        alt="artist image" style="border-radius: 50%;">
                    <div style="margin-top: 8px; font-weight: 600; color: white;" th:text="${artist.artistName}">Artist
                        Name</div>
                </a>
            </div>
        </div>
    </section>
</body>

</html>
