<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RevPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">

<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-text">RevPlay</span>
        </div>

        <h2 style="margin-bottom: 5px;">Create Account</h2>
        <p id="reg-subtitle" style="color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;">Join our
            community today</p>

        <div id="role-badge"
            style="display:inline-block; margin-bottom: 20px; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--accent); color: #fff;">
            Listener Account
        </div>

        <!-- Registration Form -->
        <form id="register-form" onsubmit="handleRegister(event)">
            <input type="hidden" id="role" name="role" value="LISTENER">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" required minlength="3">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>

            <!-- Recovery Section -->
            <div class="form-group" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <label>Security Question</label>
                <select id="securityQuestion" name="securityQuestion" required>
                    <option value="">Select a question...</option>
                    <option value="First pet?">First pet?</option>
                    <option value="Birth city?">Birth city?</option>
                    <option value="Mother's maiden name?">Mother's maiden name?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Answer</label>
                <input type="text" id="securityAnswer" name="securityAnswer" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p style="margin-top: 25px; text-align: center; color: var(--text-secondary); font-size: 14px;">
            Already have an account? <a th:href="@{/login}" style="color: var(--accent); font-weight: 600;">Sign In</a>
        </p>
    </div>
    <script>
        // When the page loads, check if we have a 'role' in the URL (e.g., ?role=ARTIST)
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'LISTENER';

        // 1. Update the UI Badge
        const roleBadge = document.getElementById('role-badge');
        const regSubtitle = document.getElementById('reg-subtitle');
        // 2. Update the Hidden Input Field (Very important for auth.js)
        const roleInput = document.getElementById('role');

        roleInput.value = role;

        if (role === 'ARTIST') {
            roleBadge.textContent = 'Artist Account';
            roleBadge.style.background = '#1DB954'; // Spotify Green
            regSubtitle.textContent = 'Join as a creator and share your music';
        } else {
            roleBadge.textContent = 'Listener Account';
            roleBadge.style.background = '#007bff'; // Modern Blue
            regSubtitle.textContent = 'Join as a listener and discover music';
        }
    </script>
    <!-- Script handling the registration API call -->
    <script th:src="@{/js/auth.js}"></script>
</body>

</html>
